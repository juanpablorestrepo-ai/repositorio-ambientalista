<h1>Dependencias Tecnológicas</h1>

<p>
Las dependencias tecnológicas ocurren cuando una persona utiliza en exceso dispositivos electrónicos como celulares, computadores o videojuegos.
</p>

<h2>Consecuencias</h2>

<ul>
    <li>Menor interacción social.</li>
    <li>Dificultad para concentrarse.</li>
    <li>Problemas de sueño.</li>
</ul>
